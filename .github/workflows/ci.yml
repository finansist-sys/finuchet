name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Privacy guard (files + commit identities)
        run: python3 scripts/privacy_guard.py all

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vercel requirements match backend pins
        run: |
          python3 - <<'EOF'
          import sys
          pins = {l.strip().lower() for l in open("requirements.txt") if "==" in l}
          vercel = [l.strip() for l in open("../requirements.txt") if "==" in l]
          bad = [l for l in vercel if l.lower() not in pins]
          print("
".join(bad) or "in sync")
          sys.exit(1 if bad else 0)
          EOF
      - run: pip install -r requirements.txt pytest pytest-asyncio ruff pip-audit
      - run: ruff check app tests alembic
      - run: pytest -q
      - run: pip-audit -r requirements.txt

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --audit-level=high
